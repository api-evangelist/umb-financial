  name: UMB Banking APIs (Open Banking / BaaS)
  description: UMB's partner-facing open-banking and Banking-as-a-Service REST API program,
    documented across five areas — Risk & Compliance (retrieve questions required for
    new customer applications), Customer (onboard customers upon application review and
    approval), Accounts (retrieve customer account details such as address and phone),
    Information (retrieve artifacts such as statements and check images), and Cash Management
    (bill payment and remote deposit capture). Access is partner-gated via consultation;
    no public developer portal, base URL, or downloadable specification is published.

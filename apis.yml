name: UMB Bank
kind: company
description: UMB Bank, National Association is the primary banking subsidiary of UMB
  Financial Corporation (Nasdaq ticker UMBF), a Kansas City, Missouri financial services
  holding company. UMB is a commercial bank operating under a national (federal) bank
  charter supervised by the Office of the Comptroller of the Currency (OCC), with roughly
  $70 billion in assets following its 2025 acquisition of Heartland Financial and branches
  across the central United States. It offers personal, commercial, and institutional
  banking, including asset servicing, corporate trust, and healthcare (HSA) services.
  UMB runs a partner-facing open-banking and Banking-as-a-Service (BaaS) program through
  its Institutional & Fintech Banking group, exposing REST APIs across risk & compliance,
  customer onboarding, accounts, information (statements/check images), and cash management.
  Access is partner-gated through a consultation and contracting process — there is no
  public self-serve developer portal, no publicly downloadable OpenAPI/Swagger specification,
  and no published FDX or CFPB 1033 posture. Consumer-permissioned account data is reached
  primarily through the Plaid aggregator rather than a first-party public API.
